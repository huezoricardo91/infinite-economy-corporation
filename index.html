<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Economy Corporation</title>
  <meta name="description" content="Infinite Economy Corporation. A company in formation.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@36..144,500;36..144,600&family=Source+Sans+3:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3eee4;
      --ink: #1b1814;
      --mute: #6a6358;
      --line: #cfc4ae;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header, main, footer {
      width: min(40rem, calc(100% - 3rem));
      margin-inline: auto;
    }

    header {
      padding-top: 2.25rem;
    }

    .mark {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mute);
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3.5rem 0 4rem;
    }

    h1 {
      margin: 0;
      font-family: Fraunces, "Iowan Old Style", Georgia, serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: clamp(2.4rem, 7vw, 3.75rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-wrap: pretty;
    }

    h1 span {
      display: block;
      font-weight: 600;
    }

    hr {
      width: 3.25rem;
      height: 1px;
      margin: 1.75rem 0 1.5rem;
      border: 0;
      background: var(--ink);
    }

    .lede {
      margin: 0;
      max-width: 32rem;
      color: var(--mute);
      font-size: 1.125rem;
      text-wrap: pretty;
    }

    footer {
      padding-bottom: 2rem;
      color: var(--mute);
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
    }

    @media (max-width: 640px) {
      header, main, footer {
        width: min(40rem, calc(100% - 2rem));
      }

      header { padding-top: 1.5rem; }
      main { padding: 2.5rem 0 3rem; }
    }
  </style>
</head>
<body>
  <header>
    <span class="mark">IEC</span>
  </header>
  <main>
    <h1>Infinite Economy <span>Corporation</span></h1>
    <hr>
    <p class="lede">This is the company’s first public page. We are starting from scratch. More will appear here as the work takes shape.</p>
  </main>
  <footer>
    <p>© 2026 Infinite Economy Corporation</p>
  </footer>
</body>
</html>
