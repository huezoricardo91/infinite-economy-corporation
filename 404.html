<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not here yet — Infinite Economy Corporation</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@36..144,500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3eee4;
      --ink: #1b1814;
      --mute: #6a6358;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      display: grid;
      place-content: center;
      padding: 1.5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 1.5rem; color: var(--mute); }
    a {
      color: var(--ink);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
    }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>This page is not here yet.</h1>
    <p>Infinite Economy Corporation is just getting started.</p>
